[package]
name = "fastvep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for fastVEP: annotate, sa-build, filter, cache, web commands"

[lib]
name = "fastvep_cli"
path = "src/lib.rs"

[[bin]]
name = "fastvep"
path = "src/main.rs"

[dependencies]
fastvep-annotate = { workspace = true }
fastvep-classification = { workspace = true }
fastvep-core = { workspace = true }
fastvep-genome = { workspace = true }
fastvep-cache = { workspace = true }
fastvep-consequence = { workspace = true }
fastvep-hgvs = { workspace = true }
fastvep-io = { workspace = true }
fastvep-filter = { workspace = true }
fastvep-sa = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
fastvep-sa = { workspace = true }
# Building a bgzipped + tabix-indexed GFF3 fixture in-process, so the
# region-restricted load path is covered without an htslib dependency.
noodles-bgzf = { workspace = true }
noodles-core = { workspace = true }
noodles-csi = { workspace = true }
noodles-tabix = { workspace = true }
