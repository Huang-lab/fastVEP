name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A branch that gets three pushes in a minute should not hold three runners.
# Only the newest run per ref matters; the older ones are cancelled. `master`
# is excluded by the `!= master` guard so pushes to it always run to
# completion and the cache below stays warm for pull requests.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # Debug info is only useful when someone is attached to a debugger, which
  # nobody is on a runner. Off, the workspace links faster and the cache below
  # stores a fraction as many bytes.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the toolchain rather than inheriting whatever the runner image
      # ships. `rust-toolchain.toml` names the same channel, so a developer's
      # local `cargo clippy` and this job resolve to one compiler instead of
      # drifting apart until a lint gap shows up as a surprise red build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Without this every run compiled all 12 crates and their dependency
      # tree from nothing, twice over (clippy and test do not share
      # artifacts). The cache is keyed on Cargo.lock and the compiler version,
      # so a dependency bump or a stable release invalidates it and anything
      # else reuses it.
      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      # Formatting first: it needs no compilation, so a misformatted branch
      # fails in seconds instead of after a full build.
      - name: Check formatting
        run: cargo fmt --all --check

      # Clippy type-checks every target on the way to linting, so this
      # subsumes the `cargo check --workspace --all-targets` that used to run
      # ahead of it - that step only bought a second copy of the same errors.
      #
      # The workspace is clippy-clean; `-D warnings` keeps it that way. A lint
      # that is wrong for a given site is silenced there with an `#[allow]` and
      # a one-line reason, so the signal here stays worth reading. The lint set
      # itself lives in `[workspace.lints]`, so a local `cargo clippy` and this
      # step disagree only about `-D`.
      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all tests (unit + integration)
        run: cargo test --workspace
