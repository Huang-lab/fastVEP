name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every target (libs, bins, tests)
        run: cargo check --workspace --all-targets
      - name: Run all tests (unit + integration)
        run: cargo test --workspace
